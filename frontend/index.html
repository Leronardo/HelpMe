<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HelpMe - Sistema de chamados</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%23FFB41F' stroke-width='6' stroke-dasharray='13 8.5'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="stylesheet" href="css/funcionario.css">
  <link rel="stylesheet" href="css/publico.css">
  <link rel="stylesheet" href="css/planos.css">
  <link rel="stylesheet" href="css/tutorial.css">
  <link rel="stylesheet" href="css/recepcao.css">
  <link rel="stylesheet" href="css/responsivo.css">
</head>
<body>
  <div id="app"></div>
  <div id="toasts" aria-live="polite"></div>

  <!-- Janela de confirmação (usada ao excluir usuário) -->
  <dialog id="dlg">
    <form method="dialog">
      <h3 id="dlg-titulo"></h3>
      <p id="dlg-msg"></p>
      <div class="dlg-acoes">
        <button value="cancelar" class="btn ghost">Cancelar</button>
        <button value="ok" class="btn danger" id="dlg-ok">Confirmar</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="js/main.js"></script>
</body>
</html>
